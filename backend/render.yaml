services:
  - type: web
    name: zeus-voice-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BASE_URL
        value: https://zeus-voice-ai.onrender.com
      - key: FRONTEND_URL
        value: https://frontend-fawn-ten-15.vercel.app
